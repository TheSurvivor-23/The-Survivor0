name: Publish Geometry Learning Portal

on:
  push:
    branches: [main]
    paths:
      - 'geometry-art-grade5/**'
      - '.github/workflows/publish-geometry-art.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check geometry-art-grade5/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload student website
        uses: actions/upload-pages-artifact@v4
        with:
          path: geometry-art-grade5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
