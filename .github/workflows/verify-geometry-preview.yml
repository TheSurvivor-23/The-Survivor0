name: Verify Direct Student Portal
on:
  push:
    branches: [main]
    paths:
      - 'geometry-art-grade5/**'
      - '.github/workflows/verify-geometry-preview.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check geometry-art-grade5/app.js
      - name: Check direct HTML hosting on CDN
        run: |
          set -eu
          root="https://rawcdn.githack.com/TheSurvivor-23/The-Survivor0/96c4731c9351747d6b511cc96678a46cab11ed76/geometry-art-grade5"
          for name in index.html style.css app.js; do
            echo "### Checking $name"
            curl --fail --location --silent --show-error --max-time 40 -D "/tmp/$name.headers" "$root/$name" -o "/tmp/$name.body"
            head -n 20 "/tmp/$name.headers"
            wc -c "/tmp/$name.body"
          done
          grep -q 'الهندسة فن' /tmp/index.html.body
          grep -q 'const MEETINGS' /tmp/app.js.body
          node --check /tmp/app.js.body
          if grep -q 'HTML preview' /tmp/index.html.body; then exit 1; fi
